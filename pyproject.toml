[project]
name = "whichai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cybersharkw", email = "jan.schwarzkopf78@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
whichai = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "backend"
